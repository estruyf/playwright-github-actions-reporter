name: Sharding sample

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - feature/*

jobs:
  testing:
    name: Shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(npm ls @playwright/test --depth=0 | grep @playwright | sed 's/.*@//')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Each shard writes its own summary, labelled with the shard
      - name: Run Playwright tests
        run: npx playwright test --config=playwright.sharding.config.ts --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        continue-on-error: true

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge:
    name: Merge the shard reports
    if: ${{ !cancelled() }}
    needs: testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download the blob reports of all shards
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # Writes a single summary with the results of all shards
      - name: Merge the reports
        run: npx playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports
        continue-on-error: true
