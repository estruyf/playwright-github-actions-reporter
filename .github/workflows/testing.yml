name: E2E Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - feature/*

jobs:
  testing:
    name: Start E2E Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Store Playwright's Version
        run: |
          PLAYWRIGHT_VERSION=$(npm ls @playwright/test --depth=0 | grep @playwright | sed 's/.*@//')
          echo "Playwright's Version: $PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

      - name: Cache Playwright Browsers for Playwright's Version
        id: cache-playwright-browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright Browsers
        if: steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test
        continue-on-error: true
        env:
          AZURE_STORAGE_SAS: ${{ secrets.AZURE_STORAGE_SAS }}
          AZURE_STORAGE_URL: ${{ vars.AZURE_STORAGE_URL }}

      - name: Show the test result outputs
        run: |
          echo "Total: ${{ steps.playwright.outputs.total }}"
          echo "Passed: ${{ steps.playwright.outputs.passed }}"
          echo "Failed: ${{ steps.playwright.outputs.failed }}"
          echo "Flaky: ${{ steps.playwright.outputs.flaky }}"
          echo "Skipped: ${{ steps.playwright.outputs.skipped }}"
          echo "Timed out: ${{ steps.playwright.outputs.timed-out }}"
          echo "Status: ${{ steps.playwright.outputs.status }}"
